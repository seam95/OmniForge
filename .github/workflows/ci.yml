name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Print Swift version
        run: swift --version

      - name: Build
        run: swift build -c release

      - name: Test
        # 本项目测试基于 XCTest，需禁用 Swift Testing 运行器以正确发现用例
        run: swift test --disable-swift-testing
